name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the plugin sources
        run: |
          node --check index.js
          node --check client.js
      - name: Validate JSON resources
        run: |
          node -e "for (const f of ['package.json','locale/en.json','locale/zh.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"
      - name: Check required bundle fields
        run: |
          node -e "const p=require('./package.json'); const need=['dsh.bundle.patch','dsh.client','exports']; if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch) throw new Error('missing dsh.bundle.patch'); if(!p.dsh.client) throw new Error('missing dsh.client'); console.log('manifest OK')"
